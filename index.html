<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Course Directory</title>
<style>
:root{--bg:#0a0a0f;--fg:#e8e8ed;--muted:#6b6b7b;--acc:#00d4aa;--card:#14141e;--border:#2a2a3e}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;min-height:100vh;min-height:100dvh;padding:clamp(12px,3vw,32px);max-width:1600px;margin:0 auto}
h1{font-size:clamp(1.2rem,4vw,1.7rem);font-weight:700;color:var(--acc)}
.sub{font-size:clamp(0.68rem,2vw,0.8rem);color:var(--muted);margin-top:4px;margin-bottom:16px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
select,input{background:var(--card);border:1px solid var(--border);color:var(--fg);padding:8px 12px;border-radius:6px;font-size:clamp(0.8rem,2vw,0.9rem);min-height:40px;flex:1 1 auto;min-width:130px}
select:focus,input:focus{outline:none;border-color:var(--acc)}
.count{font-size:clamp(0.7rem,2vw,0.8rem);color:var(--muted);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(10px,2vw,18px)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:clamp(12px,2.5vw,18px);display:flex;flex-direction:column;transition:all .2s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.card-title{font-weight:600;font-size:clamp(0.9rem,2.4vw,1rem);line-height:1.3;overflow-wrap:anywhere}
.card-title a{color:var(--fg);text-decoration:none}
.card-title a:hover{color:var(--acc)}
.badge{font-size:0.6rem;padding:2px 8px;border-radius:999px;background:rgba(0,212,170,.15);color:var(--acc);text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.card-desc{font-size:clamp(0.74rem,2vw,0.82rem);color:var(--muted);margin-bottom:12px;line-height:1.4;flex:1;overflow-wrap:anywhere}
.card-meta{display:flex;gap:6px;font-size:0.66rem;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.card-meta span{background:var(--bg);padding:3px 8px;border-radius:4px;border:1px solid var(--border)}
.open-btn{display:block;background:var(--acc);color:#0a0a0f;padding:10px 14px;border-radius:6px;text-decoration:none;font-size:clamp(0.78rem,2vw,0.85rem);font-weight:600;text-align:center;min-height:40px}
.open-btn:hover{background:#00ffcc}
.empty{text-align:center;padding:40px;color:var(--muted);grid-column:1/-1}
@media(max-width:560px){.controls{flex-direction:column}.controls select,.controls input{width:100%;flex:none}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
</style>
</head>
<body>

<h1>Free Course Directory</h1>
<div class="sub" id="meta">loading</div>

<div class="controls">
<select id="fCat">
<option value="all">Semua Kategori</option>
</select>
<select id="fDiff">
<option value="all">Semua Level</option>
<option value="beginner">Beginner</option>
<option value="intermediate">Intermediate</option>
<option value="advanced">Advanced</option>
<option value="mixed">Mixed</option>
</select>
<select id="fDur">
<option value="all">Semua Durasi</option>
<option value="short">under 20 jam</option>
<option value="medium">20-100 jam</option>
<option value="long">100+ jam</option>
</select>
<select id="fTag">
<option value="all">Semua Tag</option>
</select>
<select id="fSrc">
<option value="all">Semua Sumber</option>
</select>
<input type="text" id="fQ" placeholder="Cari kursus..." style="flex:1;min-width:180px">
</div>

<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<script>
var COURSES = [];

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function loadData() {
  fetch('courses.json?v=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      COURSES = data.courses || [];
      var when = data.updated_at ? new Date(data.updated_at).toLocaleString() : 'unknown';
      document.getElementById('meta').textContent =
        COURSES.length + ' course - ' + (data.curated || 0) + ' platform + ' +
        (data.from_feeds || 0) + ' dari feed - update ' + when;
      initFilters();
      render();
    })
    .catch(function (err) {
      document.getElementById('meta').textContent = 'gagal memuat data';
      var g = document.getElementById('grid');
      g.textContent = '';
      g.appendChild(el('div', 'empty', 'Gagal memuat courses.json: ' + err.message));
    });
}

function initFilters() {
  var cats = {}, tags = {}, srcs = {};
  COURSES.forEach(function (c) {
    if (c.cat) cats[c.cat] = 1;
    (c.tags || []).forEach(function (t) { tags[t] = 1; });
    if (c.source) srcs[c.source] = 1;
  });
  fill('fCat', cats);
  fill('fTag', tags);
  fill('fSrc', srcs);
}

function fill(id, obj) {
  var sel = document.getElementById(id);
  Object.keys(obj).sort().forEach(function (v) {
    sel.appendChild(new Option(v, v));
  });
}

function render() {
  var cat = document.getElementById('fCat').value;
  var diff = document.getElementById('fDiff').value;
  var dur = document.getElementById('fDur').value;
  var tag = document.getElementById('fTag').value;
  var src = document.getElementById('fSrc').value;
  var q = document.getElementById('fQ').value.toLowerCase().trim();

  var grid = document.getElementById('grid');
  grid.textContent = '';
  var shown = 0;

  COURSES.forEach(function (c) {
    if (cat !== 'all' && c.cat !== cat) return;
    if (diff !== 'all' && c.difficulty !== diff) return;
    if (src !== 'all' && c.source !== src) return;
    var d = c.duration || 0;
    if (dur === 'short' && !(d > 0 && d < 20)) return;
    if (dur === 'medium' && !(d >= 20 && d <= 100)) return;
    if (dur === 'long' && !(d > 100)) return;
    if (tag !== 'all' && (c.tags || []).indexOf(tag) === -1) return;
    if (q) {
      var hay = (c.name + ' ' + (c.desc || '') + ' ' + (c.tags || []).join(' ')).toLowerCase();
      if (hay.indexOf(q) === -1) return;
    }

    var card = el('div', 'card');

    var top = el('div', 'card-top');
    var h3 = el('h3', 'card-title');
    var a = el('a', null, c.name);
    a.href = c.url;
    a.target = '_blank';
    a.rel = 'noopener';
    h3.appendChild(a);
    top.appendChild(h3);
    top.appendChild(el('span', 'badge', c.cat || ''));
    card.appendChild(top);

    card.appendChild(el('p', 'card-desc', c.desc || ''));

    var meta = el('div', 'card-meta');
    meta.appendChild(el('span', null, c.difficulty || 'mixed'));
    meta.appendChild(el('span', null, (c.duration >= 9999) ? 'ongoing' : ((c.duration || '?') + 'h')));
    if (c.source) meta.appendChild(el('span', null, c.source));
    card.appendChild(meta);

    var btn = el('a', 'open-btn', 'Buka Course');
    btn.href = c.url;
    btn.target = '_blank';
    btn.rel = 'noopener';
    card.appendChild(btn);

    grid.appendChild(card);
    shown++;
  });

  if (shown === 0) {
    grid.appendChild(el('div', 'empty', 'Tidak ada yang cocok dengan filter'));
  }
  document.getElementById('count').textContent = 'Menampilkan ' + shown + ' dari ' + COURSES.length;
}

['fCat', 'fDiff', 'fDur', 'fTag', 'fSrc'].forEach(function (id) {
  document.getElementById(id).addEventListener('change', render);
});
document.getElementById('fQ').addEventListener('input', render);

loadData();
</script>

</body>
</html>
