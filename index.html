<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Course Directory</title>
<style>
:root{
  --bg:#faf6ef;--fg:#1d1b16;--muted:#8a8578;--line:#e9e2d5;--card:#fff;
  --yellow:#ffd84d;--yellow-s:#fff3c7;
  --pink:#ff9ec7;--pink-s:#ffe1ee;
  --purple:#b9a4ff;--purple-s:#ece5ff;
  --teal:#7ee0c8;--teal-s:#d6f6ee;
  --blue:#9ecbff;--blue-s:#e2f0ff;
  --coral:#ff8f7a;--coral-s:#ffe2db;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;min-height:100dvh;padding:clamp(14px,3vw,40px);max-width:1500px;margin:0 auto;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;top:-120px;left:-100px;width:380px;height:380px;border-radius:50%;background:var(--yellow-s);opacity:.7;z-index:-1}
body::after{content:"";position:fixed;bottom:-160px;right:-120px;width:480px;height:480px;border-radius:48% 52% 62% 38%/40% 60% 40% 60%;background:var(--pink-s);opacity:.55;z-index:-1}
.hero{margin-bottom:clamp(16px,3vw,28px)}
.hero h1{font-size:clamp(1.7rem,6vw,3rem);font-weight:800;letter-spacing:-0.02em;line-height:1.05}
.hero h1 em{font-style:italic;font-weight:500;color:var(--muted)}
.hero .tag{display:inline-block;margin-top:10px;background:var(--yellow);color:#1d1b16;font-size:clamp(0.72rem,2vw,0.85rem);font-weight:600;padding:6px 16px;border-radius:999px}
.sub{font-size:clamp(0.68rem,2vw,0.8rem);color:var(--muted);margin-top:10px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:clamp(16px,3vw,24px) 0}
select,input{background:var(--card);border:1.5px solid var(--line);color:var(--fg);padding:10px 14px;border-radius:14px;font-size:clamp(0.8rem,2vw,0.9rem);min-height:44px;flex:1 1 auto;min-width:130px;font-family:inherit}
select:focus,input:focus{outline:none;border-color:var(--purple)}
.count{font-size:clamp(0.7rem,2vw,0.8rem);color:var(--muted);margin-bottom:16px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:clamp(12px,2vw,20px)}
.card{background:var(--card);border:none;border-radius:24px;padding:clamp(16px,2.5vw,22px);display:flex;flex-direction:column;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;box-shadow:0 2px 0 var(--line)}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.08)}
.card::before{content:"";position:absolute;top:-38px;right:-38px;width:130px;height:130px;border-radius:50%;background:var(--blob,var(--yellow-s));opacity:1}
.card::after{content:"";position:absolute;bottom:-26px;left:-26px;width:78px;height:78px;border-radius:34% 66% 58% 42%/48% 38% 62% 52%;background:var(--blob,var(--yellow-s));opacity:.55}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;position:relative;z-index:1}
.card-title{font-weight:700;font-size:clamp(0.95rem,2.4vw,1.08rem);line-height:1.25;overflow-wrap:anywhere}
.card-title a{color:var(--fg);text-decoration:none}
.card-title a:hover{text-decoration:underline}
.badge{font-size:0.62rem;padding:5px 11px;border-radius:999px;background:var(--chip,var(--yellow));color:#1d1b16;font-weight:700;text-transform:uppercase;white-space:nowrap;flex-shrink:0;letter-spacing:.02em}
.card-desc{font-size:clamp(0.76rem,2vw,0.84rem);color:var(--muted);margin-bottom:14px;line-height:1.45;flex:1;overflow-wrap:anywhere;position:relative;z-index:1}
.card-meta{display:flex;gap:6px;font-size:0.66rem;color:var(--fg);margin-bottom:14px;flex-wrap:wrap;position:relative;z-index:1}
.card-meta span{background:var(--bg);padding:4px 10px;border-radius:999px;font-weight:600}
.open-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:#1d1b16;color:#fff;padding:12px 16px;border-radius:16px;text-decoration:none;font-size:clamp(0.8rem,2vw,0.88rem);font-weight:700;text-align:center;min-height:46px;position:relative;z-index:1;transition:background .15s}
.open-btn:hover{background:#38342b}
.open-btn .arrow{transition:transform .15s}
.open-btn:hover .arrow{transform:translateX(3px)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);grid-column:1/-1;font-size:0.95rem}
@media(max-width:560px){.controls{flex-direction:column}.controls select,.controls input{width:100%;flex:none}}
@media(min-width:1300px){.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
</style>
</head>
<body>

<div class="hero">
<h1>Discover, Learn, <em>Grow.</em></h1>
<div class="tag">100% gratis - selalu update</div>
<div class="sub" id="meta">loading</div>
</div>

<div class="controls">
<select id="fCat"><option value="all">Semua Kategori</option></select>
<select id="fDiff">
<option value="all">Semua Level</option>
<option value="beginner">Beginner</option>
<option value="intermediate">Intermediate</option>
<option value="advanced">Advanced</option>
<option value="mixed">Mixed</option>
</select>
<select id="fDur">
<option value="all">Semua Durasi</option>
<option value="short">under 20 jam</option>
<option value="medium">20-100 jam</option>
<option value="long">100+ jam</option>
</select>
<select id="fTag"><option value="all">Semua Tag</option></select>
<select id="fSrc"><option value="all">Semua Sumber</option></select>
<input type="text" id="fQ" placeholder="Cari kursus..." style="flex:2;min-width:180px">
</div>

<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<script>
var COURSES = [];

// pastel color per category (blob bg + chip)
var PALETTE = ['yellow','pink','purple','teal','blue','coral'];
var CAT_COLOR = {};
function colorFor(cat){
  if (!CAT_COLOR[cat]) {
    var used = Object.keys(CAT_COLOR).length;
    CAT_COLOR[cat] = PALETTE[used % PALETTE.length];
  }
  return CAT_COLOR[cat];
}

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function loadData() {
  fetch('courses.json?v=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      COURSES = data.courses || [];
      var when = data.updated_at ? new Date(data.updated_at).toLocaleString() : 'unknown';
      document.getElementById('meta').textContent =
        COURSES.length + ' course - ' + (data.curated || 0) + ' platform + ' +
        (data.from_feeds || 0) + ' dari feed - update ' + when;
      // pre-assign colors sorted so it's stable
      var cats = {};
      COURSES.forEach(function(c){ if(c.cat) cats[c.cat]=1; });
      Object.keys(cats).sort().forEach(colorFor);
      initFilters();
      render();
    })
    .catch(function (err) {
      document.getElementById('meta').textContent = 'gagal memuat data';
      var g = document.getElementById('grid');
      g.textContent = '';
      g.appendChild(el('div', 'empty', 'Gagal memuat courses.json: ' + err.message));
    });
}

function initFilters() {
  var cats = {}, tags = {}, srcs = {};
  COURSES.forEach(function (c) {
    if (c.cat) cats[c.cat] = 1;
    (c.tags || []).forEach(function (t) { tags[t] = 1; });
    if (c.source) srcs[c.source] = 1;
  });
  fill('fCat', cats); fill('fTag', tags); fill('fSrc', srcs);
}

function fill(id, obj) {
  var sel = document.getElementById(id);
  Object.keys(obj).sort().forEach(function (v) { sel.appendChild(new Option(v, v)); });
}

function render() {
  var cat = document.getElementById('fCat').value;
  var diff = document.getElementById('fDiff').value;
  var dur = document.getElementById('fDur').value;
  var tag = document.getElementById('fTag').value;
  var src = document.getElementById('fSrc').value;
  var q = document.getElementById('fQ').value.toLowerCase().trim();

  var grid = document.getElementById('grid');
  grid.textContent = '';
  var shown = 0;

  COURSES.forEach(function (c) {
    if (cat !== 'all' && c.cat !== cat) return;
    if (diff !== 'all' && c.difficulty !== diff) return;
    if (src !== 'all' && c.source !== src) return;
    var d = c.duration || 0;
    if (dur === 'short' && !(d > 0 && d < 20)) return;
    if (dur === 'medium' && !(d >= 20 && d <= 100)) return;
    if (dur === 'long' && !(d > 100)) return;
    if (tag !== 'all' && (c.tags || []).indexOf(tag) === -1) return;
    if (q) {
      var hay = (c.name + ' ' + (c.desc || '') + ' ' + (c.tags || []).join(' ')).toLowerCase();
      if (hay.indexOf(q) === -1) return;
    }

    var color = colorFor(c.cat || 'Other');
    var card = el('div', 'card');
    card.style.setProperty('--blob', 'var(--' + color + '-s)');

    var top = el('div', 'card-top');
    var h3 = el('h3', 'card-title');
    var a = el('a', null, c.name);
    a.href = c.url; a.target = '_blank'; a.rel = 'noopener';
    h3.appendChild(a);
    top.appendChild(h3);
    var badge = el('span', 'badge', c.cat || '');
    badge.style.setProperty('--chip', 'var(--' + color + ')');
    top.appendChild(badge);
    card.appendChild(top);

    card.appendChild(el('p', 'card-desc', c.desc || ''));

    var meta = el('div', 'card-meta');
    meta.appendChild(el('span', null, c.difficulty || 'mixed'));
    meta.appendChild(el('span', null, (c.duration >= 9999) ? 'ongoing' : ((c.duration || '?') + 'h')));
    if (c.source) meta.appendChild(el('span', null, c.source));
    card.appendChild(meta);

    var btn = el('a', 'open-btn');
    btn.href = c.url; btn.target = '_blank'; btn.rel = 'noopener';
    btn.appendChild(el('span', null, 'Buka Course'));
    btn.appendChild(el('span', 'arrow', '\u2192'));
    card.appendChild(btn);

    grid.appendChild(card);
    shown++;
  });

  if (shown === 0) grid.appendChild(el('div', 'empty', 'Tidak ada yang cocok dengan filter'));
  document.getElementById('count').textContent = 'Menampilkan ' + shown + ' dari ' + COURSES.length;
}

['fCat', 'fDiff', 'fDur', 'fTag', 'fSrc'].forEach(function (id) {
  document.getElementById(id).addEventListener('change', render);
});
document.getElementById('fQ').addEventListener('input', render);

loadData();
</script>

</body>
</html>
