<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Course Info — always updated</title>
<style>
:root{--bg:#0a0a0f;--fg:#e8e8ed;--muted:#6b6b7b;--acc:#00d4aa;--acc2:#ff6b6b;--card:#14141e;--border:#2a2a3e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;min-height:100vh;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--acc),#00ffcc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:0.72rem;color:var(--muted);font-weight:400}
.controls{display:flex;gap:8px;flex-wrap:wrap}
select,input,button{background:var(--card);border:1px solid var(--border);color:var(--fg);padding:8px 12px;border-radius:6px;font-size:0.85rem}
select:focus,input:focus{outline:none;border-color:var(--acc)}
button{cursor:pointer;transition:all .15s}
button.primary{background:var(--acc);color:#0a0a0f;border:none;font-weight:600}
button.primary:hover{background:#00ffcc}
button.secondary{background:transparent;border-color:var(--acc);color:var(--acc)}
button.secondary:hover{background:rgba(0,212,170,.1)}
.stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:104px}
.stat-label{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-size:1.2rem;font-weight:700;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;transition:all .2s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.card-title{font-weight:600;font-size:0.93rem}
.card-title a{color:var(--fg);text-decoration:none}
.card-title a:hover{color:var(--acc)}
.badge{font-size:0.6rem;padding:2px 8px;border-radius:999px;background:rgba(0,212,170,.15);color:var(--acc);text-transform:uppercase;white-space:nowrap}
.card-desc{font-size:0.78rem;color:var(--muted);margin-bottom:10px;line-height:1.4}
.card-meta{display:flex;gap:6px;font-size:0.66rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.card-meta span{background:var(--bg);padding:3px 8px;border-radius:4px;border:1px solid var(--border)}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:10px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--acc),#00ffcc);transition:width .3s}
.card-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{padding:5px 10px;font-size:0.72rem}
.btn-sm.completed{background:var(--acc);color:#0a0a0f;border:none}
.btn-sm.started{background:rgba(255,107,107,.2);border-color:var(--acc2);color:var(--acc2)}
.note-input{width:100%;margin-top:8px;padding:8px;font-size:0.74rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--fg);resize:vertical;min-height:52px}
.empty{text-align:center;padding:40px;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;visibility:hidden;transition:all .2s}
.modal.open{opacity:1;visibility:visible}
.modal-content{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:640px;width:92%;max-height:82vh;overflow:auto;position:relative}
.modal h3{margin-bottom:14px;color:var(--acc)}
.close-btn{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;padding:0}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);padding:12px 20px;border-radius:8px;z-index:200;transform:translateY(120px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
table{width:100%;border-collapse:collapse;font-size:0.78rem}
th,td{padding:8px;border-bottom:1px solid var(--border)}
th{text-align:left;color:var(--muted);font-weight:600}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
<div>
<h1>Free Course Info</h1>
<div class="sub" id="lastUpdated">loading...</div>
</div>
<div class="controls">
<select id="categoryFilter"><option value="all">Semua Kategori</option></select>
<select id="difficultyFilter">
<option value="all">Semua Level</option>
<option value="beginner">Beginner</option>
<option value="intermediate">Intermediate</option>
<option value="advanced">Advanced</option>
<option value="mixed">Mixed</option>
</select>
<select id="durationFilter">
<option value="all">Semua Durasi</option>
<option value="short">under 20 jam</option>
<option value="medium">20-100 jam</option>
<option value="long">100+ jam</option>
</select>
<select id="tagFilter"><option value="all">Semua Tag</option></select>
<select id="sourceFilter"><option value="all">Semua Sumber</option></select>
<input type="text" id="searchInput" placeholder="Cari kursus...">
<button class="primary" onclick="exportData()">Export</button>
<button class="secondary" onclick="openModal('importModal')">Import</button>
<button class="secondary" onclick="openModal('statsModal')">Stats</button>
</div>
</div>

<div class="stats">
<div class="stat"><div class="stat-label">Total</div><div class="stat-value" id="statTotal">0</div></div>
<div class="stat"><div class="stat-label">Tampil</div><div class="stat-value" id="statShown">0</div></div>
<div class="stat"><div class="stat-label">Started</div><div class="stat-value" id="statStarted">0</div></div>
<div class="stat"><div class="stat-label">Completed</div><div class="stat-value" id="statCompleted">0</div></div>
<div class="stat"><div class="stat-label">Jam</div><div class="stat-value" id="statHours">0</div></div>
</div>

<div class="grid" id="courseGrid"></div>

<div class="modal" id="statsModal">
<div class="modal-content">
<button class="close-btn" onclick="closeModal('statsModal')">x</button>
<h3>Progress Detail</h3>
<div id="statsDetail"></div>
</div>
</div>

<div class="modal" id="importModal">
<div class="modal-content">
<button class="close-btn" onclick="closeModal('importModal')">x</button>
<h3>Import Progress</h3>
<textarea class="note-input" id="importText" placeholder="Paste JSON hasil Export..."></textarea>
<div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
<button class="primary" onclick="doImport()">Import</button>
<button class="secondary" onclick="closeModal('importModal')">Batal</button>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
let COURSES = [];
let progress = JSON.parse(localStorage.getItem('courseProgress') || '{}');

// escape via DOM, no entity literals needed
function esc(s){ const d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

function getState(id){ return progress[id] || { status:'none', hours:0, notes:'', started:null, completed:null }; }
function setState(id, patch){ progress[id] = Object.assign({}, getState(id), patch); saveProgress(); }
function saveProgress(){ localStorage.setItem('courseProgress', JSON.stringify(progress)); render(); }

async function loadCourses(){
  try {
    const res = await fetch('courses.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    COURSES = data.courses || [];
    const when = data.updated_at ? new Date(data.updated_at).toLocaleString() : 'unknown';
    document.getElementById('lastUpdated').textContent =
      COURSES.length + ' entri - ' + (data.curated || 0) + ' platform pilihan + ' + (data.from_feeds || 0) + ' dari feed - update ' + when;
    initFilters();
    render();
  } catch (err) {
    console.error(err);
    document.getElementById('courseGrid').innerHTML = '<div class="empty">Gagal memuat courses.json (' + esc(err.message) + ')</div>';
    document.getElementById('lastUpdated').textContent = 'gagal memuat data';
  }
}

function initFilters(){
  const cats = new Set(), tags = new Set(), srcs = new Set();
  COURSES.forEach(function(c){
    if (c.cat) cats.add(c.cat);
    (c.tags || []).forEach(function(t){ tags.add(t); });
    if (c.source) srcs.add(c.source);
  });
  fill('categoryFilter', cats);
  fill('tagFilter', tags);
  fill('sourceFilter', srcs);
}

function fill(id, set){
  const el = document.getElementById(id);
  Array.from(set).sort().forEach(function(v){ el.add(new Option(v, v)); });
}

function render(){
  const grid = document.getElementById('courseGrid');
  const cat = document.getElementById('categoryFilter').value;
  const diff = document.getElementById('difficultyFilter').value;
  const dur = document.getElementById('durationFilter').value;
  const tag = document.getElementById('tagFilter').value;
  const src = document.getElementById('sourceFilter').value;
  const q = document.getElementById('searchInput').value.toLowerCase().trim();

  const parts = [];
  let shown = 0;

  COURSES.forEach(function(c){
    if (cat !== 'all' && c.cat !== cat) return;
    if (diff !== 'all' && c.difficulty !== diff) return;
    if (src !== 'all' && c.source !== src) return;
    const d = c.duration || 0;
    if (dur === 'short' && !(d > 0 && d < 20)) return;
    if (dur === 'medium' && !(d >= 20 && d <= 100)) return;
    if (dur === 'long' && !(d > 100)) return;
    if (tag !== 'all' && !(c.tags || []).includes(tag)) return;
    if (q) {
      const hay = (c.name + ' ' + (c.desc || '') + ' ' + (c.tags || []).join(' ')).toLowerCase();
      if (hay.indexOf(q) === -1) return;
    }

    const s = getState(c.id);
    const pct = s.status === 'completed' ? 100 : s.status === 'started' ? 50 : 0;
    const durTxt = (c.duration >= 9999) ? 'ongoing' : (c.duration || '?') + 'h';
    const doneLabel = s.status === 'completed' ? 'Done' : 'Selesai';
    const startLabel = s.status === 'started' ? 'Started' : 'Mulai';
    const nextDone = s.status === 'completed' ? 'none' : 'completed';
    const nextStart = s.status === 'started' ? 'none' : 'started';

    parts.push(
      '<div class="card">' +
        '<div class="card-header">' +
          '<h3 class="card-title"><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a></h3>' +
          '<span class="badge">' + esc(c.cat) + '</span>' +
        '</div>' +
        '<p class="card-desc">' + esc(c.desc || '') + '</p>' +
        '<div class="card-meta">' +
          '<span>' + esc(c.difficulty || 'mixed') + '</span>' +
          '<span>' + durTxt + '</span>' +
          (c.source ? '<span>' + esc(c.source) + '</span>' : '') +
        '</div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="card-actions">' +
          '<button class="btn-sm ' + (s.status === 'completed' ? 'completed' : '') + '" onclick="toggleStatus(\'' + c.id + '\',\'' + nextDone + '\')">' + doneLabel + '</button>' +
          '<button class="btn-sm ' + (s.status === 'started' ? 'started' : '') + '" onclick="toggleStatus(\'' + c.id + '\',\'' + nextStart + '\')">' + startLabel + '</button>' +
          '<button class="btn-sm secondary" onclick="addHours(\'' + c.id + '\')">+1 Jam</button>' +
          '<button class="btn-sm secondary" onclick="editNotes(\'' + c.id + '\')">Catatan</button>' +
        '</div>' +
        (s.notes ? '<textarea class="note-input" readonly>' + esc(s.notes) + '</textarea>' : '') +
      '</div>'
    );
    shown++;
  });

  grid.innerHTML = shown ? parts.join('') : '<div class="empty">Tidak ada yang cocok dengan filter</div>';
  updateStats(shown);
}

function toggleStatus(id, status){
  const s = getState(id);
  const now = new Date().toISOString();
  if (status === 'completed') { setState(id, { status:'completed', completed:now, started:s.started || now }); toast('Completed'); }
  else if (status === 'started') { setState(id, { status:'started', started:s.started || now }); toast('Started'); }
  else { setState(id, { status:'none' }); toast('Reset'); }
}

function addHours(id){
  const s = getState(id);
  setState(id, { hours:(s.hours || 0) + 1, status: s.status === 'none' ? 'started' : s.status, started: s.started || new Date().toISOString() });
  toast('+1 jam');
}

function editNotes(id){
  const s = getState(id);
  const c = COURSES.find(function(x){ return x.id === id; });
  const note = prompt('Catatan untuk ' + (c ? c.name : id), s.notes || '');
  if (note !== null) {
    setState(id, { notes:note, status: s.status === 'none' ? 'started' : s.status, started: s.started || new Date().toISOString() });
    toast('Catatan disimpan');
  }
}

function updateStats(shown){
  let started = 0, completed = 0, hours = 0;
  Object.values(progress).forEach(function(s){
    if (s.status === 'started') started++;
    if (s.status === 'completed') completed++;
    hours += s.hours || 0;
  });
  document.getElementById('statTotal').textContent = COURSES.length;
  document.getElementById('statShown').textContent = (shown === undefined ? COURSES.length : shown);
  document.getElementById('statStarted').textContent = started;
  document.getElementById('statCompleted').textContent = completed;
  document.getElementById('statHours').textContent = hours;
}

function openModal(id){ document.getElementById(id).classList.add('open'); if (id === 'statsModal') renderStats(); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function renderStats(){
  const rows = [];
  COURSES.forEach(function(c){
    const s = getState(c.id);
    if (s.status === 'none' && !s.notes) return;
    rows.push(
      '<tr>' +
        '<td>' + esc(c.name) + '</td>' +
        '<td>' + esc(s.status) + '</td>' +
        '<td>' + (s.hours || 0) + '</td>' +
        '<td>' + (s.started ? new Date(s.started).toLocaleDateString() : '-') + '</td>' +
        '<td>' + (s.completed ? new Date(s.completed).toLocaleDateString() : '-') + '</td>' +
      '</tr>'
    );
  });
  document.getElementById('statsDetail').innerHTML = rows.length
    ? '<table><tr><th>Course</th><th>Status</th><th>Jam</th><th>Mulai</th><th>Selesai</th></tr>' + rows.join('') + '</table>'
    : '<p style="color:var(--muted);text-align:center">Belum ada progress</p>';
}

function exportData(){
  const blob = new Blob([JSON.stringify(progress, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'course-progress-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  toast('Exported');
}

function doImport(){
  try {
    const v = document.getElementById('importText').value.trim();
    progress = v ? JSON.parse(v) : {};
    saveProgress();
    closeModal('importModal');
    toast('Imported');
  } catch (e) {
    toast('JSON tidak valid');
  }
}

['categoryFilter','difficultyFilter','durationFilter','tagFilter','sourceFilter'].forEach(function(id){
  document.getElementById(id).addEventListener('change', render);
});
document.getElementById('searchInput').addEventListener('input', render);

loadCourses();
</script>
</body>
</html>
